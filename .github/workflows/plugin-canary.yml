name: Plugin canary

# The bundles this repo rehosts are consumed by hosts we do not control. The
# `latest/` paths are uploaded no-cache and named directly by the jb2hubs configs
# (jbrowse.org/ucsc/*, jbrowse.org/hubs/genark/*), which sit at permanent urls
# that published links and old desktop installs keep loading. So a plugin author
# publishing to npm, plus a nightly `pnpm dep`, can error-page every one of those
# without anyone pushing here — and push-triggered CI structurally cannot see it.
# This watches what S3 is actually serving, on a timer.
#
# jb2hubs runs an equivalent canary, but only over the plugins its configs name
# (MsaView, Hubs). The other fifteen in plugins.json have no watcher anywhere
# else.

on:
  schedule:
    # every 6h, matching jb2hubs. GitHub disables scheduled workflows after 60
    # days of repo inactivity, which the nightly deploy job keeps clear of.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: plugin-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install

      - name: Probe published bundles
        id: probe
        env:
          # preinstalled on the ubuntu runner image, so no browser action and no
          # Chromium download
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set +e
          probe() { pnpm canary 2>&1; echo "canary exit=$?"; }

          probe >canary.log
          if grep -q '^canary exit=[^0]' canary.log; then
            # One retry before alerting. A canary that reports a transient CDN
            # blip as an outage gets muted, and a muted canary is worse than
            # none, so a failure has to survive twice to count.
            echo 'first pass failed, retrying once to rule out a transient' \
              >>canary.log
            sleep 120
            probe >canary-retry.log
            cat canary-retry.log >>canary.log
            if grep -q '^canary exit=[^0]' canary-retry.log; then
              echo 'status=broken' >>"$GITHUB_OUTPUT"
            else
              echo 'status=flaky' >>"$GITHUB_OUTPUT"
            fi
          else
            echo 'status=ok' >>"$GITHUB_OUTPUT"
          fi
          cat canary.log

      - name: Open or update the alert issue
        if: steps.probe.outputs.status == 'broken'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          # One rolling issue, not one per run: a new issue every 6h for the same
          # outage trains you to ignore the label.
          existing=$(gh issue list --label plugin-canary --state open \
            --json number --jq '.[0].number')
          {
            echo 'A published plugin bundle fails to load on a hosted JBrowse release.'
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```'
            tail -c 60000 canary.log
            echo '```'
          } >body.md
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title 'Plugin canary: a published bundle is broken' \
              --label plugin-canary --body-file body.md
          fi

      - name: Close the alert issue on recovery
        if: steps.probe.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --label plugin-canary --state open \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment 'Canary is green again; closing automatically.'
          fi

      - name: Fail the run when broken
        if: steps.probe.outputs.status == 'broken'
        run: exit 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: canary-log
          path: canary*.log
